# prefix
unbind C-b
set -g prefix c-a
bind c-a send-prefix

# History
set -g history-limit 5000

bind-key -T root F5 send-keys 'ao' Enter
bind-key -T root F2 send-keys 'glo.line.day && echo '' && glo.day && echo '' &&  glo.line &&  echo '' && glo.month ' Enter


# bind reload key
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-p previous-window
bind -n M-n next-window

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-v split-window -h
bind -n M-b split-window -v
bind -n M-z resize-pane -Z

# Alt+数字 直接切 session
# bind -n M-0 switch-client -t me
# bind -n M-9 switch-client -t work
bind -n M-s switch-client -l  # 切换到最近的session
bind -n M-[ switch-client -p  # 切换到上一个 Session
bind -n M-] switch-client -n  # 切换到下一个 Session
bind -n M-e choose-tree -Zs  # 等价于 Prefix s

# Set easier window split keys
bind-key v split-window -h
bind-key b split-window -v

set -g cursor-style underline

# Mouse mode
set -g mouse on
setw -g mode-keys vi

# don't rename windows automatically 
set-option -g allow-rename off

# color
# screen-256color 是为了兼容极其古老的 GNU Screen 工具而设计的
# set -g default-terminal "screen-256color"
set -g default-terminal "xterm-256color"
#  这行配置的核心作用是打补丁。Ms 序列是告诉 Tmux：“当里面运行的程序（如 vim/lazygit）想要操作系统的剪贴板或者复杂的鼠标选中时，允许把这个控制流直接穿透透传给 Ghostty”。这进一步保证了点击和拖拽事件在通过 SSH 传输时不会被中间的协议栈给“阉割”掉。
# tmux 3.5需要 3.6不需要了 tmux 3.6 的 terminfo 数据库已经内置了 Ghostty 的完整支持
set -as terminal-overrides ",xterm-ghostty:Ms=\E]52;c;%p2%s\007"


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

set-option -g status-position top

set-option -g repeat-time 0

# Auto Notify

# 1. 开启静默监控（单位：秒）。比如设定 5 秒没输出就认为跑完了
# setw -g monitor-silence 5
# 2. 只有当你在其他 Window 时才提醒，还是任何时候都提醒？
# 如果想任何时候都提醒，确保 visual-silence 为 off
# set -g visual-silence off

# 对所有的都开启
# bind -n M-g if-shell "tmux show-window-options -v monitor-silence | grep -q 5" \
#     "setw monitor-silence 0; display-message '静默监控已关闭'" \
#     "setw monitor-silence 5; display-message '静默监控已开启 (5s)'"

# 单次模式：触发一次后自动关闭监控
# set-hook -g alert-silence 'display-popup -E "echo ✅ 任务完成; sleep 2"; setw monitor-silence 0'


# Removes ESC delay
set -sg escape-time 0

# List of plugins
set -g @tpm_plugins '                     \
    caiogondim/maglev                     \
    tmux-plugins/tpm                      \
    tmux-plugins/tmux-sensible            \
    tmux-plugins/tmux-pain-control        \
    tmux-plugins/tmux-copycat             \
    tmux-plugins/tmux-yank             \
    tmux-plugins/tmux-open                \
    tmux-plugins/tmux-prefix-highlight    \
'

# tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '6000'
set -g @continuum-restore 'on'
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

set-option -g default-command '/usr/bin/zsh'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# 顶栏状态
# 设置状态栏每 60 秒更新一次价格和时间
set-option -g status-interval 60

# 特别注意这里的脚本是每个 tmux session都独立的定时器去调用的，所以工具自身需要做好缓存 降流
set-option -g status-right "#(zk-newapi) #[fg=yellow]#(gold -l)#[fg=white] %m-%d %a"

