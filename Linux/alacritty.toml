# alacritty.toml (≥ 0.13)
# 绑定 Ctrl + Shift + T 创建新标签页

[window]
# 启动时大小（列 × 行）
dimensions = { columns = 100, lines = 40 }
# 可调整
dynamic_title = true
# F11 全屏
startup_mode = "Windowed"


[font]
# 系统等宽字体，可换成 'FiraCode Nerd Font' 等
normal = { family = "monospace", style = "Regular" }
size = 11.5

[colors]
# 默认暗色主题（Alacritty 内置）
primary = { background = "#282c34", foreground = "#ffffff" }

[keyboard]
# 绑定 Ctrl + Shift + T → 新建标签（Alacritty ≥ 0.13 原生）
[[keyboard.bindings]]
key = "T"
mods = "Control | Shift"
action = "CreateNewTab"

# 常用保留
[[keyboard.bindings]]
key = "F11"
mods = "None"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
chars = "\u0003"

[selection]
# 选中即复制
save_to_clipboard = true

[scrolling]
# 滚动条可见
history = 10000
multiplier = 3

[cursor] 
# [[cursor.style]] 
# shape = "Underline"
# blinking = "Always" 